<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Xonobod Bugun — Chiroq, Suv, Gaz va Zapravkalar xaritasi</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#2ca7f2" />
  <meta name="description" content="Xonobod va Sultonoboddagi chiroq, suv, gaz uzilishlari hamda metan, propan va benzin zapravkalar holati jonli xaritada." />

  <!-- Превью карточки при пересылке ссылки в Telegram -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Xonobod Bugun" />
  <meta property="og:title" content="⚡ Xonobod Bugun — Jonli xarita" />
  <meta property="og:description" content="Xonobod va Sultonobodda chiroq, suv, gaz uzilishlari va zapravkalar (metan/propan/benzin) holati real vaqtda." />

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Стили и карта (Tailwind + Leaflet + локальный CSS) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-100 select-none">

  <div id="map"></div>

  <!-- Погода в левом верхнем углу (ПК) -->
  <div id="weather-card-desktop"
    class="hidden sm:flex fixed top-4 left-4 z-[1000] items-center gap-2.5 bg-white/95 backdrop-blur-md rounded-2xl shadow-[0_6px_24px_rgba(15,23,42,0.1)] border border-slate-200/70 px-4 py-2.5">
    <span id="weather-icon-desktop" class="text-2xl leading-none">⛅</span>
    <span id="weather-temp-desktop" class="text-[22px] font-bold text-slate-800 leading-none tracking-tight">--°</span>
  </div>

  <!-- Главная панель: мобилка сверху на всю ширину, ПК строго в правом верхнем углу -->
  <div class="fixed top-3 left-3 right-3 sm:top-4 sm:left-auto sm:right-4 sm:w-[348px] z-[1000] pointer-events-none">
    <div class="bg-white/95 backdrop-blur-md rounded-[20px] shadow-[0_8px_30px_rgba(15,23,42,0.12)] border border-slate-200/70 p-3.5 pointer-events-auto">

      <!-- Строка 1: Бренд + Zapravkalar (+ мобильная погода) -->
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div class="font-bold text-[17px] tracking-tight text-slate-900 whitespace-nowrap shrink-0 leading-none">
          Xonobod <span class="text-sky-500">Bugun</span>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btn-stations-tab" type="button"
            class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[12px] font-medium whitespace-nowrap transition">
            <span class="flex items-center gap-0.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span class="w-2 h-2 rounded-full bg-amber-400"></span>
              <span class="w-2 h-2 rounded-full bg-rose-500"></span>
            </span>
            <span>Zapravkalar</span>
            <span class="text-[10px] opacity-65">↗</span>
          </button>

          <div id="weather-box-mobile" class="flex sm:hidden items-center gap-0.5 text-xs font-semibold text-slate-500 whitespace-nowrap">
            <span>⛅</span><span>--°</span>
          </div>
        </div>
      </div>

      <!-- Строка 2: Переключатель территорий (Barchasi / Xonobod / Sultonobod) -->
      <div id="settlement-row" class="flex items-center gap-1.5 mb-2 overflow-x-auto no-scrollbar"></div>

      <!-- Строка 3: Chiroq / Suv / Gaz -->
      <div class="grid grid-cols-3 gap-1.5 mb-2">
        <button id="tab-power" data-utility="power" type="button"
          class="py-1.5 px-2 rounded-xl text-[12.5px] font-medium border transition flex items-center justify-center gap-1 whitespace-nowrap">⚡ Chiroq</button>
        <button id="tab-water" data-utility="water" type="button"
          class="py-1.5 px-2 rounded-xl text-[12.5px] font-medium border transition flex items-center justify-center gap-1 whitespace-nowrap">💧 Suv</button>
        <button id="tab-gas" data-utility="gas" type="button"
          class="py-1.5 px-2 rounded-xl text-[12.5px] font-medium border transition flex items-center justify-center gap-1 whitespace-nowrap">🔥 Gaz</button>
      </div>

      <!-- Строка 4: Фильтры (Botdan / Rejali или Metan / Propan / Benzin) -->
      <div id="filter-row" class="flex items-center gap-1.5 mb-2.5 overflow-x-auto no-scrollbar"></div>

      <!-- Строка 5: Навигация -->
      <div class="flex items-center justify-between text-[12.5px] text-slate-400 mb-2">
        <div class="flex items-center gap-3.5">
          <button id="btn-stats" type="button" class="hover:text-slate-700 transition">Statistika</button>
          <button id="btn-faq" type="button" class="hover:text-slate-700 transition">Savol-javob</button>
          <button id="btn-timeline" type="button" class="hover:text-slate-700 transition">Taymlayn</button>
        </div>
        <button id="btn-edit-coords" type="button" class="hidden text-xs text-sky-600 hover:text-sky-700 font-semibold">
          📍 Tahrirlash
        </button>
      </div>

      <!-- Строка 6: Сводка и время -->
      <div class="leading-snug">
        <div id="summary-text" class="text-[12.5px] text-slate-700">Yuklanmoqda...</div>
        <div id="updated-text" class="text-[11.5px] text-slate-400 mt-0.5">Yangilanmoqda...</div>
      </div>
    </div>

    <!-- Редактор координат (только при /?edit=1) -->
    <div id="edit-bar" class="hidden mt-2 bg-slate-900/95 backdrop-blur text-white rounded-2xl shadow-xl p-3 pointer-events-auto">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-amber-300">📍 Koordinatalarni sozlash</span>
        <button id="btn-edit-close" type="button" class="text-xs text-slate-300 hover:text-white">✕ Yopish</button>
      </div>
      <div class="flex items-center gap-1.5 mb-2">
        <button id="btn-edit-prev" type="button" class="px-2.5 py-1 bg-slate-700 rounded-lg text-xs">‹</button>
        <select id="edit-select" class="flex-1 bg-slate-800 text-white text-xs rounded-lg px-2 py-1.5 border border-slate-700"></select>
        <button id="btn-edit-next" type="button" class="px-2.5 py-1 bg-slate-700 rounded-lg text-xs">›</button>
      </div>
      <div class="flex gap-2">
        <button id="btn-edit-copy" type="button" class="flex-1 py-1.5 bg-sky-500 hover:bg-sky-600 rounded-lg text-xs font-semibold">📋 JSON nusxalash</button>
        <button id="btn-edit-download" type="button" class="flex-1 py-1.5 bg-emerald-500 hover:bg-emerald-600 rounded-lg text-xs font-semibold">⬇️ mahallas.json</button>
      </div>
    </div>
  </div>

  <!-- Переключатель спутника справа над зумом -->
  <button id="btn-layer" type="button" title="Xarita / Yo‘ldosh"
    class="fixed bottom-[96px] right-[16px] z-[900] w-[34px] h-[34px] rounded-[10px] bg-white/95 backdrop-blur shadow-[0_4px_16px_rgba(15,23,42,0.12)] border border-slate-200/80 flex items-center justify-center text-base hover:bg-slate-50 active:scale-95 transition">
    🛰️
  </button>

  <!-- Легенда слева внизу -->
  <div id="legend-box"
    class="fixed bottom-[86px] sm:bottom-4 left-3 sm:left-4 z-[900] bg-white/95 backdrop-blur-md rounded-2xl shadow-[0_6px_24px_rgba(15,23,42,0.1)] border border-slate-200/70 px-3.5 py-2.5 text-[12px] text-slate-700 space-y-1.5"></div>

  <!-- Центральная кнопка снизу + Telegram-ссылка -->
  <div class="fixed bottom-3 left-3 right-3 sm:left-1/2 sm:right-auto sm:-translate-x-1/2 sm:w-auto z-[950] flex flex-col items-center gap-1 pointer-events-none">
    <button id="cta-btn" type="button"
      class="pointer-events-auto w-full sm:w-auto sm:min-w-[270px] py-3 px-6 rounded-full bg-[#2ca7f2] hover:bg-[#1e96e0] active:scale-[0.98] text-white font-semibold text-[14px] shadow-[0_6px_22px_rgba(44,167,242,0.45)] transition flex items-center justify-center gap-2 whitespace-nowrap">
      ⚡ Uzilish haqida xabar berish
    </button>
    <button id="btn-contact" type="button"
      class="pointer-events-auto text-[11.5px] font-medium text-slate-600 hover:text-sky-600 text-halo transition py-0.5">
      Biz bilan bog‘lanish · Telegram-bot
    </button>
  </div>

  <!-- Универсальное модальное окно -->
  <div id="modal-backdrop" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-[1100] flex items-end sm:items-center justify-center p-3">
    <div id="modal-card" class="w-full max-w-md bg-white rounded-3xl shadow-2xl max-h-[84vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-100">
        <h3 id="modal-title" class="font-bold text-slate-900 text-base"></h3>
        <button id="modal-close" type="button" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 transition">✕</button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto text-sm text-slate-700"></div>
    </div>
  </div>

  <!-- Тост-уведомление -->
  <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-[1200] bg-slate-900/95 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl max-w-[90vw] text-center"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
